# Cloudflare — Retro League est exporte en site STATIQUE (dossier `out/`).
# Deploiement via les "Workers static assets" : `wrangler deploy` sert
# directement le dossier out/ (plus besoin d'adaptateur Next).
#
#   Build  : npm run build      (genere out/)
#   Deploy : npx wrangler deploy
name = "retro-league"
compatibility_date = "2024-12-30"

# Genere out/ avant le deploiement (utile si la build command n'est pas
# configuree dans le dashboard Cloudflare).
[build]
command = "npm run build"

[assets]
directory = "./out"
not_found_handling = "single-page-application"
